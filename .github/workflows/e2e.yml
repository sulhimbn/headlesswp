name: E2E Tests (Playwright)

# E2E-003: Playwright E2E runs on SCHEDULE, not on every commit.
# Critical user flows only (homepage → article, search), Chromium only.
on:
  schedule:
    # Every Monday 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

concurrency:
  group: e2e
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Install Playwright Chromium
        run: npx playwright install chromium --only-shell

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: 'true'
          NEXT_PUBLIC_WORDPRESS_URL: ${{ secrets.WORDPRESS_URL || 'https://example.com' }}
          NEXT_PUBLIC_WORDPRESS_API_URL: ${{ secrets.WORDPRESS_API_URL || 'https://example.com/wp-json' }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL || 'https://example.com' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 14
